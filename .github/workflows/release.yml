name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the 7z parts into one zip
        run: |
          sudo apt-get install -y p7zip-full zip >/dev/null
          7z x download/OperationValueChain-win64.7z.001 -oout > /dev/null
          cd out && zip -q -r -9 ../OperationValueChain-win64.zip OperationValueChain && cd ..
          ls -la OperationValueChain-win64.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(date +%Y.%m.%d-%H%M)";; esac
          gh release create "$TAG" OperationValueChain-win64.zip --title "Operation Value Chain $TAG" --notes-file .github/release-notes.md --target "$GITHUB_SHA"
